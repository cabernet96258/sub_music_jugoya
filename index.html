<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十五夜さんのもちつき リズムづくり</title>
<style>
  :root {
    --slot: 60px;
    --bg: #fffaf0;
    --panel: #ffffff;
    --ink: #333333;
    --muted: #8a7f70;
    --line: #d9cbb4;
    --accent: #e8702a;
    --note-bg: #fff0d9;
    --note-border: #f0a040;
    --note-bar: #f5b560;
    --rest-bg: #e3f0fc;
    --rest-border: #6aa3d8;
    --rest-bar: #a8cbee;
    --ok: #4caf50;
    --ng: #e53935;
    --playbar: #e53935;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 16px;
    min-height: 100%;
  }
  h1 { margin: 0; font-size: 24px; color: var(--accent); letter-spacing: .05em; }
  header.top { display: flex; align-items: baseline; gap: 12px; }
  header.top .copy { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
  h1 small { font-size: 16px; color: var(--muted); margin-left: .5em; }

  /* ---------- コントロール ---------- */
  #controls {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--panel); border-radius: 14px; padding: 8px 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  button {
    font: inherit; font-size: 18px; font-weight: bold;
    border: 3px solid transparent; border-radius: 12px;
    padding: 8px 16px; cursor: pointer; background: #eee; color: var(--ink);
    min-height: 48px;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #btnPlay { background: #ffe0cc; border-color: var(--accent); }
  #btnPause { background: #fff4c2; border-color: #d8b400; }
  #btnStop { background: #e6e6e6; border-color: #999; }
  #btnOtehon { background: #f3f3f3; border-color: #bbb; }
  #btnOtehon[aria-pressed="true"] { background: #ffd6e5; border-color: #e0557f; color: #b0003a; }
  #btnClear { background: #fff; border-color: #ccc; font-size: 15px; margin-left: auto; }
  .sep { width: 2px; height: 36px; background: var(--line); }
  .tempo { display: flex; align-items: center; gap: 8px; font-weight: bold; }
  .tempo input { width: 130px; accent-color: var(--accent); }
  .sound { display: flex; align-items: center; gap: 8px; font-weight: bold; }
  .sound select {
    font: inherit; font-size: 17px; font-weight: bold; min-height: 48px; padding: 4px 8px;
    border: 3px solid #9ccc65; border-radius: 12px; background: #f1f8e9; color: var(--ink); cursor: pointer;
  }
  .sound select:disabled { opacity: .35; cursor: not-allowed; }
  .tempo output { display: inline-block; min-width: 3ch; font-size: 26px; color: var(--accent); text-align: right; }

  /* ---------- ミニマップ ---------- */
  #minimap {
    position: relative; height: 34px; background: var(--panel);
    border: 2px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer;
    touch-action: none;
  }
  #minimap .mm-measure { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
  #minimap .mm-measure span { position: absolute; top: 1px; left: 3px; font-size: 10px; color: var(--muted); }
  #minimap .mm-note { position: absolute; top: 13px; height: 15px; border-radius: 3px; background: var(--note-border); }
  #minimap .mm-note.rest { background: var(--rest-border); }
  #minimap #mmWindow {
    position: absolute; top: 0; bottom: 0; border: 3px solid var(--accent);
    border-radius: 6px; background: rgba(232,112,42,.08); pointer-events: none;
  }
  #minimap #mmHead { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--playbar); display: none; pointer-events: none; }
  body.playmode #minimap #mmWindow { display: none; }
  body.playmode #minimap #mmHead { display: block; }

  /* ---------- 点数と星 ---------- */
  #topbar { display: flex; align-items: center; gap: 12px; }
  #topbar #minimap { flex: 1; }
  #score {
    display: flex; align-items: center; gap: 10px; padding: 3px 14px;
    background: var(--panel); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  #stars { display: flex; gap: 3px; }
  .star { position: relative; width: 36px; height: 36px; }
  .star svg { width: 100%; height: 100%; overflow: visible; }
  .star path { fill: #eceff1; stroke: #cfd8dc; stroke-width: 1.5; stroke-linejoin: round; transition: fill .2s, stroke .2s; }
  .star.lit path { fill: #ffd600; stroke: #f9a825; }
  .star.lit svg { filter: drop-shadow(0 0 5px rgba(255,214,0,.9)); }
  .star.kiran svg { animation: kiran .7s ease-out; }
  @keyframes kiran {
    0% { transform: scale(.3) rotate(-40deg); }
    50% { transform: scale(1.5) rotate(15deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .star::after {
    content: "✦"; position: absolute; top: -10px; right: -8px; font-size: 18px; color: #ffca28;
    opacity: 0; text-shadow: 0 0 6px #fff59d; pointer-events: none;
  }
  .star.kiran::after { animation: glint .7s ease-out .15s; }
  @keyframes glint {
    0% { opacity: 0; transform: scale(.2); }
    40% { opacity: 1; transform: scale(1.5) rotate(45deg); }
    100% { opacity: 0; transform: scale(.6) rotate(90deg); }
  }
  /* けっか はっぴょう */
  #result {
    position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center;
    background: rgba(40,30,10,.45);
  }
  #result.show { display: flex; }
  #result .box {
    background: #fffdf5; border: 6px solid #ffca28; border-radius: 28px; padding: 26px 44px 24px;
    text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.3); min-width: 520px;
    animation: boxIn .4s ease-out;
  }
  @keyframes boxIn { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
  #result h2 { margin: 0 0 14px; font-size: 34px; color: var(--accent); letter-spacing: .1em; }
  #resStars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 12px; }
  #resStars .star { width: 72px; height: 72px; }
  #resStars .star::after { font-size: 28px; top: -14px; right: -12px; }
  #resText { min-height: 140px; }
  #resText .big { font-size: 40px; font-weight: 900; color: #f9a825; -webkit-text-stroke: 1px #e65100; }
  #resText .pts { font-size: 22px; font-weight: bold; color: var(--muted); margin-top: 2px; }
  #resText .msg { font-size: 24px; font-weight: bold; color: #e91e63; margin-top: 6px; }
  #resText > * { animation: boxIn .4s ease-out; }
  #resClose { margin-top: 14px; background: #ffe0cc; border-color: var(--accent); font-size: 20px; padding: 8px 40px; }

  #points { font-size: 22px; font-weight: 900; color: var(--accent); min-width: 4.2em; text-align: right; white-space: nowrap; }

  /* 判定のエフェクト（バーの少し左＝たたいた音符が流れていく側に出す） */
  .judge {
    position: absolute; left: calc(50% - 90px); top: 0; z-index: 25; pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
    animation: judgeUp .7s ease-out forwards;
  }
  .judge .mk { font-size: 66px; line-height: 1; font-weight: 900; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; }
  .judge .wd { font-size: 20px; font-weight: 900; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; }
  @keyframes judgeUp {
    0% { transform: translateX(-50%) scale(.4); opacity: 0; }
    20% { transform: translateX(-50%) scale(1.25); opacity: 1; }
    40% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-26px); opacity: 0; }
  }

  /* ---------- 帯（楽譜） ---------- */
  #stage { position: relative; }
  #viewport {
    position: relative; overflow-x: auto; overflow-y: hidden;
    background: var(--panel); border-radius: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    scrollbar-width: auto; scrollbar-color: #d8b58c #f4ead9;
  }
  #viewport::-webkit-scrollbar { height: 16px; }
  #viewport::-webkit-scrollbar-track { background: #f4ead9; border-radius: 8px; }
  #viewport::-webkit-scrollbar-thumb { background: #d8b58c; border-radius: 8px; }
  body.playmode #viewport { overflow: hidden; }
  #band { position: relative; height: 184px; will-change: transform; }
  .measure { position: absolute; top: 0; width: calc(var(--slot) * 4); height: 100%; }
  .lyric {
    position: absolute; top: 6px; left: 4px; right: 4px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; border-radius: 10px; white-space: nowrap;
    transition: background .15s;
  }
  .lyric .no { position: absolute; left: 4px; top: 1px; font-size: 11px; color: var(--muted); font-weight: normal; }
  .measure.now .lyric { background: #fff176; }
  .row {
    position: absolute; top: 50px; left: 0; width: 100%; height: 124px;
    border-left: 3px solid #555; background: #fcfaf6;
  }
  .measure.last .row { border-right: 7px double #555; }
  .row .g { position: absolute; top: 8px; bottom: 8px; border-left: 2px dotted #e2d6c2; }
  .row .g.beat { border-left: 2px dashed #c9b594; }

  /* ---------- 音符カード ---------- */
  .card {
    position: absolute; height: 112px;
    background: var(--note-bg); border: 3px solid var(--note-border); border-radius: 10px;
    color: #222; touch-action: none; cursor: grab;
    transform-origin: 30px 60%;
  }
  .card.rest { background: var(--rest-bg); border-color: var(--rest-border); }
  .card svg.sym { position: absolute; left: 4px; top: 2px; width: 40px; height: 70px; overflow: visible; }
  .card.w2 svg.sym { width: 100px; }
  .card .len { position: absolute; left: 46px; right: 8px; top: 50px; height: 10px; border-radius: 5px; background: var(--note-bar); }
  .card.rest .len { background: var(--rest-bar); }
  .card .lbl { position: absolute; left: 0; right: 0; bottom: 6px; padding-left: 6px; font-size: 20px; font-weight: bold; }
  .card .nm { position: absolute; left: 0; right: 0; top: -24px; text-align: center; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .card.placed { top: 56px; }
  .card.dragging-src { opacity: .25; }
  .card.ghost {
    position: fixed; z-index: 1000; pointer-events: none; opacity: .92;
    box-shadow: 0 8px 18px rgba(0,0,0,.25); transform: scale(1.04);
  }
  .card.pop { animation: pop .25s ease-out; z-index: 5; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.4); }
    75% { transform: scale(.95); }
    100% { transform: scale(1); }
  }
  .card.sounding { background: #ffd54f; border-color: #ff8f00; box-shadow: 0 0 14px rgba(255,160,0,.8); }
  /* 休符は大きくならず「キュッ」と縮み、休みのあいだ小さく薄いままにする */
  .card.rest.placed { transform-origin: center; transition: transform .15s ease-out, opacity .15s ease-out; }
  .card.rest.pop { animation: shrink .25s ease-out; }
  @keyframes shrink {
    0% { transform: scale(1); }
    45% { transform: scale(.62); }
    100% { transform: scale(.78); }
  }
  .card.rest.sounding { transform: scale(.78); opacity: .65; background: #d0d7de; border-color: #8a96a3; }

  #hint { position: absolute; top: 50px; height: 124px; border-radius: 10px; pointer-events: none; display: none; z-index: 3; }
  #hint.ok { display: block; background: rgba(76,175,80,.18); border: 3px dashed var(--ok); }
  #hint.ng { display: block; background: rgba(229,57,53,.22); border: 3px solid var(--ng); }

  /* ---------- 再生バー・カウント ---------- */
  #playbar {
    position: absolute; top: 44px; bottom: 0; left: 50%; width: 6px; margin-left: -3px;
    background: var(--playbar); border-radius: 3px; display: none; z-index: 10; pointer-events: none;
    box-shadow: 0 0 8px rgba(229,57,53,.6);
  }
  #playbar::before {
    content: ""; position: absolute; top: -14px; left: -9px;
    border: 12px solid transparent; border-top: 14px solid var(--playbar); border-bottom: 0;
  }
  body.playmode #playbar { display: block; }
  #playbar.inzone { background: #ff2d8a; box-shadow: 0 0 14px 4px rgba(255,45,138,.75); }
  #playbar.inzone::before { border-top-color: #ff2d8a; }

  /* はなまるになるタイミングの範囲（再生中・一時停止中だけ表示） */
  #zones { display: none; }
  body.playmode.scoring #zones { display: block; }
  .hz {
    position: absolute; top: 50px; height: 124px; z-index: 4; pointer-events: none;
    background: rgba(255,64,160,.12);
    border-left: 1px solid rgba(255,45,138,.35); border-right: 1px solid rgba(255,45,138,.35);
    transition: opacity .25s;
  }
  .hz::after {
    content: "💮"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 16px; line-height: 1;
  }
  .hz.done { opacity: 0; }
  #count {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 150px; font-weight: 900; color: var(--accent); z-index: 20; pointer-events: none;
    -webkit-text-stroke: 6px #fff; paint-order: stroke fill;
    text-shadow: 0 4px 12px rgba(0,0,0,.25);
  }
  #count.show { display: flex; }
  #count span { display: inline-block; }
  #count span.go { animation: countIn .45s ease-out; }
  @keyframes countIn { 0% { transform: scale(.4); opacity: 0; } 50% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

  /* ---------- パレット ---------- */
  #palette {
    background: var(--panel); border-radius: 14px; padding: 10px 14px 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  #palette .phead { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; }
  #palette h2 { margin: 0; font-size: 16px; color: var(--muted); }
  #btnShot { margin-left: auto; min-height: 40px; padding: 4px 16px; font-size: 16px; background: #e3f2fd; border-color: #64b5f6; color: #1565c0; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 3000; transform: translateX(-50%) translateY(20px);
    background: #333; color: #fff; font-size: 18px; font-weight: bold; padding: 12px 22px; border-radius: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap;
  }
  #toast.show { opacity: .95; transform: translateX(-50%) translateY(0); }
  #cards { display: flex; align-items: flex-end; gap: 40px; flex-wrap: wrap; row-gap: 38px; }
  #cards .card { position: relative; }
  #trash {
    margin-left: auto; width: 110px; height: 112px; border: 3px dashed #bbb; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #999; font-size: 14px; font-weight: bold; gap: 4px;
  }
  #trash svg { width: 44px; height: 44px; }
  #trash.active { border-color: var(--ng); color: var(--ng); background: #ffebee; }
  body.playmode #palette, body.pausemode #palette,
  body.playmode #ranking, body.pausemode #ranking { opacity: .4; pointer-events: none; }

  /* ---------- じぶんランキング ---------- */
  #ranking {
    background: var(--panel); border-radius: 14px; padding: 8px 14px 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  #ranking .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  #ranking h2 { margin: 0; font-size: 18px; color: #b8860b; }
  #rankHint { font-size: 14px; color: var(--muted); font-weight: bold; }
  #rankClear { margin-left: auto; font-size: 13px; min-height: 32px; padding: 4px 12px; background: #fff; border: 2px solid #ddd; color: #999; }
  #rankList { list-style: none; margin: 0; padding: 0; display: flex; gap: 10px; }
  #rankList li {
    position: relative; flex: 1; min-width: 0; height: 84px; border-radius: 12px;
    display: grid; grid-template-columns: 46px 1fr; grid-template-rows: auto auto auto; column-gap: 6px;
    align-items: center; padding: 6px 10px; background: #faf7f0; border: 3px solid #eee3cf;
  }
  #rankList li .medal { grid-row: 1 / 4; font-size: 34px; text-align: center; line-height: 1; }
  #rankList li .medal small { display: block; font-size: 15px; font-weight: 900; color: var(--muted); }
  #rankList li .pts { font-size: 24px; font-weight: 900; color: var(--accent); line-height: 1.1; white-space: nowrap; }
  #rankList li .pts .st { font-size: 14px; color: #f9a825; margin-left: 4px; letter-spacing: -1px; }
  #rankList li .ttl { font-size: 13px; font-weight: bold; color: #6d4c41; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rankList li .meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #rankList li.r1 { background: linear-gradient(135deg, #fff8d6, #ffecb3); border-color: #ffca28; }
  #rankList li.r2 { background: linear-gradient(135deg, #f7f9fa, #e3e8ec); border-color: #b0bec5; }
  #rankList li.r3 { background: linear-gradient(135deg, #fff3ea, #f6dcc8); border-color: #d7a07a; }
  #rankList li.r1 .medal { animation: crown 2.4s ease-in-out infinite; }
  @keyframes crown { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.08); } }
  #rankList li.empty { background: #fcfcfc; border-style: dashed; color: #bbb; }
  #rankList li.empty .pts { color: #ccc; font-size: 18px; }
  #rankList li.new { animation: newGlow 1.2s ease-in-out 4; }
  @keyframes newGlow { 0%, 100% { box-shadow: 0 0 0 rgba(255,64,160,0); } 50% { box-shadow: 0 0 16px 4px rgba(255,64,160,.6); } }
  #rankList li .newb {
    position: absolute; top: -10px; right: -6px; background: #ff2d8a; color: #fff; font-size: 12px; font-weight: 900;
    padding: 2px 7px; border-radius: 10px; transform: rotate(8deg); animation: bounce .8s ease-in-out infinite;
  }
  @keyframes bounce { 0%, 100% { transform: rotate(8deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-4px); } }

  /* 結果発表のランキング行と紙吹雪 */
  #resText .rank { font-size: 26px; font-weight: 900; margin-top: 8px; }
  #resText .rank.top { color: #e65100; animation: boxIn .5s ease-out, shine 1s ease-in-out .5s 3; }
  #resText .rank.in { color: #d81b60; }
  #resText .rank.out { color: #5c6bc0; font-size: 20px; }
  @keyframes shine { 0%, 100% { text-shadow: 0 0 0 #fff176; } 50% { text-shadow: 0 0 14px #ffd600; } }
  .confetti { position: fixed; top: -20px; z-index: 3000; width: 10px; height: 14px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  body.playmode #band, body.pausemode #band { pointer-events: none; }

  @media (max-width: 900px) {
    h1 { font-size: 20px; }
    .tempo input { width: 140px; }
  }
</style>
</head>
<body>
  <header class="top">
    <h1>じゅうごやさんの もちつき <small>リズムをつくろう ／ さいせい中は スペースキーで うってみよう</small></h1>
    <span class="copy">©Junichi Ono</span>
  </header>

  <div id="controls">
    <button id="btnPlay" type="button">▶ さいせい</button>
    <button id="btnPause" type="button" disabled>❚❚ いちじていし</button>
    <button id="btnStop" type="button" disabled>■ ていし</button>
    <div class="sep"></div>
    <button id="btnOtehon" type="button" aria-pressed="false">👏 おてほん OFF</button>
    <div class="sep"></div>
    <label class="sound">おと
      <select id="sound"></select>
    </label>
    <div class="sep"></div>
    <label class="tempo">テンポ
      <input id="bpm" type="range" min="60" max="120" step="1" value="80">
      <output id="bpmVal">80</output>
    </label>
    <button id="btnClear" type="button">ぜんぶけす</button>
  </div>

  <div id="topbar">
    <div id="minimap" aria-label="ぜんたいの地図"><div id="mmNotes"></div><div id="mmWindow"></div><div id="mmHead"></div></div>
    <div id="score" title="さいせい中に スペースキーで リズムを うとう"><div id="stars"></div><div id="points">-- てん</div></div>
  </div>

  <div id="stage">
    <div id="viewport"><div id="band"><div id="measures"></div><div id="notes"></div><div id="zones"></div><div id="hint"></div></div></div>
    <div id="playbar"></div>
    <div id="count"><span></span></div>
  </div>

  <div id="palette">
    <div class="phead">
      <h2>おんぷカード（ドラッグしておんぷをおいてみよう）</h2>
      <button id="btnShot" type="button" title="つくったリズムを がぞうにして コピーします">📷 リズムを コピー</button>
    </div>
    <div id="cards">
      <div id="trash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/></svg>
        ここにすてる
      </div>
    </div>
  </div>

  <section id="ranking">
    <div class="head">
      <h2>🏆 じぶんランキング</h2>
      <span id="rankHint">おてほん OFF で さいごまで えんそうすると きろくが のこるよ</span>
      <button id="rankClear" type="button">ランキングをけす</button>
    </div>
    <ol id="rankList"></ol>
  </section>

  <div id="toast"></div>

  <div id="result" role="dialog" aria-label="けっか はっぴょう">
    <div class="box">
      <h2>けっか はっぴょう！</h2>
      <div id="resStars"></div>
      <div id="resText"></div>
      <button id="resClose" type="button">とじる</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // ===== 定数 =====
  const SLOT = 60;              // 八分音符 1 マスの幅(px)
  const MEASURE = SLOT * 4;     // 2/4 拍子 1 小節 = 八分音符 4 つ
  const NM = 8;                 // 小節数
  const TOTAL = NM * 4;         // 全体の八分音符マス数
  const PAD = 24;               // 帯の左右の余白
  const CARD_INSET = 3;         // マスとカードのすき間
  const STORE_KEY = 'jugoya-rhythm-v1';

  const LYRICS = ['じゅうごやさんの', 'もちつきは', 'トーントーン', 'トッテッタ',
                  'トーントーン', 'トッテッタ', 'トッテトッテ', 'トッテッタ'];

  // dur は八分音符いくつ分か
  const TYPES = {
    q:  { dur: 2, label: 'タン', name: 'しぶおんぷ',        rest: false },
    e:  { dur: 1, label: 'タ',   name: 'はちぶおんぷ',      rest: false },
    ee: { dur: 2, label: 'タタ', name: 'にれんはちぶおんぷ', rest: false },
    h:  { dur: 4, label: 'ター', name: 'にぶおんぷ',        rest: false },
    qr: { dur: 2, label: 'ウン', name: 'しぶきゅうふ',      rest: true },
    er: { dur: 1, label: 'ウ',   name: 'はちぶきゅうふ',    rest: true },
  };
  const PALETTE = ['q', 'e', 'ee', 'h', 'qr', 'er'];
  const RANK_SIZE = 5;
  const SOUND_KEYS = ['poko', 'piyo', 'piko', 'kira', 'pettan', 'wood'];

  // ===== 状態 =====
  const state = { notes: [], bpm: 80, otehon: false, sound: 'poko', ranking: [] };
  let nextId = 1;
  let mode = 'edit';            // 'edit' | 'playing' | 'paused'
  let pausedE = 0;
  let session = null;
  let drag = null;
  const noteEls = new Map();
  const zoneEls = new Map();

  // ===== 要素 =====
  const $ = (id) => document.getElementById(id);
  const viewport = $('viewport'), band = $('band'), measuresEl = $('measures'), notesEl = $('notes'),
        hint = $('hint'), zonesEl = $('zones'), playbar = $('playbar'), countEl = $('count'), countSpan = countEl.querySelector('span'),
        mmNotes = $('mmNotes'), mmWindow = $('mmWindow'), mmHead = $('mmHead'), minimap = $('minimap'),
        cardsEl = $('cards'), trash = $('trash'), stage = $('stage'), starsEl = $('stars'), pointsEl = $('points'),
        resultEl = $('result'), resStars = $('resStars'), resText = $('resText'), resClose = $('resClose'),
        rankList = $('rankList'), rankClear = $('rankClear'), btnShot = $('btnShot'), toastEl = $('toast'),
        btnPlay = $('btnPlay'), btnPause = $('btnPause'), btnStop = $('btnStop'),
        btnOtehon = $('btnOtehon'), soundSel = $('sound'), btnClear = $('btnClear'), bpmInput = $('bpm'), bpmVal = $('bpmVal');

  // ===== 保存 =====
  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (_) { saved = null; }
    if (!saved || typeof saved !== 'object') return;
    if (Number.isFinite(saved.bpm)) state.bpm = Math.min(120, Math.max(60, Math.round(saved.bpm)));
    state.otehon = !!saved.otehon;
    if (typeof saved.sound === 'string' && SOUND_KEYS.includes(saved.sound)) state.sound = saved.sound;
    if (Array.isArray(saved.ranking)) {
      state.ranking = saved.ranking
        .filter((r) => r && Number.isFinite(r.pct) && Number.isFinite(r.bpm) && typeof r.date === 'string')
        .map((r) => ({ pct: Math.min(100, Math.max(0, Math.round(r.pct))), bpm: Math.round(r.bpm), date: r.date }))
        .slice(0, RANK_SIZE);
    }
    if (Array.isArray(saved.notes)) {
      for (const n of saved.notes) {
        if (!n || !TYPES[n.t] || n.t === 'ee') continue;
        const m = n.m | 0, p = n.p | 0, dur = TYPES[n.t].dur;
        if (m < 0 || m >= NM || p < 0 || p + dur > 4) continue;
        if (state.notes.some((o) => o.m === m && overlaps(o, p, dur))) continue;
        state.notes.push({ id: nextId++, m, p, t: n.t });
      }
    }
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        notes: state.notes.map((n) => ({ m: n.m, p: n.p, t: n.t })),
        bpm: state.bpm, otehon: state.otehon, sound: state.sound, ranking: state.ranking,
      }));
    } catch (_) { /* 保存できない環境でも動作は続ける */ }
  }

  // ===== 音符データ操作 =====
  function overlaps(n, p, dur) {
    const d = TYPES[n.t].dur;
    return n.p < p + dur && p < n.p + d;
  }
  function startOf(n) { return n.m * 4 + n.p; }

  // 小節 m の位置 p に type を置く（重なるカードは上書き）
  function place(type, m, p) {
    const dur = TYPES[type].dur;
    state.notes = state.notes.filter((n) => !(n.m === m && overlaps(n, p, dur)));
    if (type === 'ee') {
      state.notes.push({ id: nextId++, m, p, t: 'e' }, { id: nextId++, m, p: p + 1, t: 'e' });
    } else {
      state.notes.push({ id: nextId++, m, p, t: type });
    }
  }

  // 同じ小節で隣り合う八分音符を、左から順に 2 つずつ連桁にする
  function computeBeams() {
    const roles = new Map();
    for (let m = 0; m < NM; m++) {
      const es = state.notes.filter((n) => n.m === m && n.t === 'e').sort((a, b) => a.p - b.p);
      for (let i = 0; i < es.length;) {
        if (i + 1 < es.length && es[i + 1].p === es[i].p + 1) {
          roles.set(es[i].id, 'L'); roles.set(es[i + 1].id, 'R');
          i += 2;
        } else {
          i += 1;
        }
      }
    }
    return { roles };
  }

  // ===== 音符の SVG =====
  const HEAD = (cx, filled) => filled
    ? `<ellipse cx="${cx}" cy="56" rx="8.5" ry="6" transform="rotate(-20 ${cx} 56)" fill="currentColor"/>`
    : `<ellipse cx="${cx}" cy="56" rx="7.6" ry="5.2" transform="rotate(-20 ${cx} 56)" fill="none" stroke="currentColor" stroke-width="2.8"/>`;
  const STEM = (x) => `<rect x="${x}" y="12" width="2.4" height="44" fill="currentColor"/>`;
  const FLAG = '<path d="M25.2 12 C25.5 22 36.5 25 34.5 39 C34 42 33 45 31.5 47 C33.5 37 30 30 25.2 28 Z" fill="currentColor"/>';

  // 連桁は左右どちらのカードにも同じ横棒を描く（光って前面に出ても消えないように）
  // L: 自分の符幹から右隣の符幹まで、R: 左隣の符幹から自分の符幹まで
  const BEAM = { L: '<rect x="22.8" y="12" width="62.4" height="6" fill="currentColor"/>',
                 R: '<rect x="-37.2" y="12" width="62.4" height="6" fill="currentColor"/>' };

  function symbolSVG(type, beam) {
    switch (type) {
      case 'q':  return `<svg class="sym" viewBox="0 0 40 70">${HEAD(16, true)}${STEM(22.8)}</svg>`;
      case 'h':  return `<svg class="sym" viewBox="0 0 40 70">${HEAD(16, false)}${STEM(22.8)}</svg>`;
      case 'e':  return `<svg class="sym" viewBox="0 0 40 70">${HEAD(16, true)}${STEM(22.8)}${beam ? BEAM[beam] : FLAG}</svg>`;
      case 'ee': return `<svg class="sym" viewBox="0 0 100 70">${HEAD(16, true)}${STEM(22.8)}${HEAD(76, true)}${STEM(82.8)}<rect x="22.8" y="12" width="62.4" height="6" fill="currentColor"/></svg>`;
      case 'qr': return '<svg class="sym" viewBox="0 0 40 70"><path d="M14 10 L25 24 L17 35 L27 48 C19 44 14 50 21 60" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
      case 'er': return '<svg class="sym" viewBox="0 0 40 70"><circle cx="14" cy="28" r="4.8" fill="currentColor"/><path d="M14 31 C19 35 25 32 29 25 L20 58" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    return '';
  }

  function makeCard(type, opts = {}) {
    const def = TYPES[type];
    const el = document.createElement('div');
    el.className = 'card' + (def.rest ? ' rest' : '') + (type === 'ee' ? ' w2' : '');
    el.style.width = (def.dur * SLOT - CARD_INSET * 2) + 'px';
    const showLen = def.dur >= 2 && type !== 'ee';
    const lbl = type === 'ee' ? 'タ<span style="display:inline-block;width:41px"></span>タ' : def.label;
    el.innerHTML = symbolSVG(type, opts.beam) + (showLen ? '<div class="len"></div>' : '') +
      `<div class="lbl">${lbl}</div>` + (opts.name ? `<div class="nm">${def.name}</div>` : '');
    return el;
  }

  // ===== 描画 =====
  function buildMeasures() {
    band.style.width = (PAD * 2 + NM * MEASURE) + 'px';
    for (let m = 0; m < NM; m++) {
      const el = document.createElement('div');
      el.className = 'measure' + (m === NM - 1 ? ' last' : '');
      el.style.left = (PAD + m * MEASURE) + 'px';
      el.innerHTML = `<div class="lyric"><span class="no">${m + 1}</span>${LYRICS[m]}</div>` +
        `<div class="row"><div class="g" style="left:${SLOT}px"></div><div class="g beat" style="left:${SLOT * 2}px"></div><div class="g" style="left:${SLOT * 3}px"></div></div>`;
      measuresEl.appendChild(el);
    }
  }

  function renderNotes() {
    notesEl.innerHTML = '';
    noteEls.clear();
    const { roles } = computeBeams();
    for (const n of state.notes) {
      const el = makeCard(n.t, { beam: roles.get(n.id) });
      el.classList.add('placed');
      el.style.left = (PAD + startOf(n) * SLOT + CARD_INSET) + 'px';
      el.addEventListener('pointerdown', (ev) => startDrag(ev, { from: 'band', id: n.id, type: n.t }));
      notesEl.appendChild(el);
      noteEls.set(n.id, el);
    }
    renderZones();
    renderMinimap();
  }

  // 音符ごとに「はなまる」になる範囲をピンクの帯で示す。幅はテンポで変わる
  function renderZones() {
    zonesEl.innerHTML = '';
    zoneEls.clear();
    const half = GRADES[0].win / (30 / state.bpm) * SLOT;   // 秒 → px
    for (const n of state.notes) {
      if (TYPES[n.t].rest) continue;
      const z = document.createElement('div');
      z.className = 'hz';
      z.style.left = (PAD + startOf(n) * SLOT - half) + 'px';
      z.style.width = (half * 2) + 'px';
      zonesEl.appendChild(z);
      zoneEls.set(n.id, z);
    }
  }

  function buildPalette() {
    for (const type of PALETTE) {
      const el = makeCard(type, { name: true });
      el.addEventListener('pointerdown', (ev) => startDrag(ev, { from: 'palette', type }));
      cardsEl.insertBefore(el, trash);
    }
  }

  // ===== ミニマップ =====
  function buildMinimap() {
    for (let m = 0; m < NM; m++) {
      const d = document.createElement('div');
      d.className = 'mm-measure';
      d.style.left = (m / NM * 100) + '%';
      d.style.width = (100 / NM) + '%';
      d.innerHTML = `<span>${m + 1}</span>`;
      minimap.insertBefore(d, mmNotes);
    }
  }
  function renderMinimap() {
    mmNotes.innerHTML = '';
    for (const n of state.notes) {
      const d = document.createElement('div');
      d.className = 'mm-note' + (TYPES[n.t].rest ? ' rest' : '');
      d.style.left = `calc(${startOf(n) / TOTAL * 100}% + 1px)`;
      d.style.width = `calc(${TYPES[n.t].dur / TOTAL * 100}% - 2px)`;
      mmNotes.appendChild(d);
    }
    updateMinimapWindow();
  }
  function updateMinimapWindow() {
    const w = NM * MEASURE;
    const from = Math.max(0, (viewport.scrollLeft - PAD) / w);
    const to = Math.min(1, (viewport.scrollLeft + viewport.clientWidth - PAD) / w);
    mmWindow.style.left = (from * 100) + '%';
    mmWindow.style.width = (Math.max(0, to - from) * 100) + '%';
  }
  function minimapJump(ev) {
    if (mode !== 'edit') return;
    const r = minimap.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    viewport.scrollLeft = PAD + frac * NM * MEASURE - viewport.clientWidth / 2;
  }
  minimap.addEventListener('pointerdown', (ev) => {
    minimapJump(ev);
    minimap.setPointerCapture(ev.pointerId);
  });
  minimap.addEventListener('pointermove', (ev) => { if (ev.buttons) minimapJump(ev); });
  viewport.addEventListener('scroll', updateMinimapWindow);
  window.addEventListener('resize', updateMinimapWindow);

  // ===== ドラッグ＆ドロップ（Pointer Events：マウスとタッチの両方に対応） =====
  function startDrag(ev, src) {
    if (mode !== 'edit' || drag) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    ev.preventDefault();
    const srcEl = ev.currentTarget;
    const r = srcEl.getBoundingClientRect();
    const ghost = makeCard(src.type);
    ghost.classList.add('ghost');
    document.body.appendChild(ghost);
    drag = {
      src, srcEl, ghost, type: src.type, dur: TYPES[src.type].dur,
      offX: ev.clientX - r.left, offY: ev.clientY - r.top,
      x: ev.clientX, y: ev.clientY, target: undefined, pointerId: ev.pointerId, raf: 0,
    };
    if (src.from === 'band') srcEl.classList.add('dragging-src');
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragCancel);
    updateDrag();
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function onDragMove(ev) {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    drag.x = ev.clientX; drag.y = ev.clientY;
    updateDrag();
  }

  // 帯の上なら {m, p, valid}、帯の外なら null
  function computeTarget() {
    const vr = viewport.getBoundingClientRect();
    if (drag.x < vr.left || drag.x > vr.right || drag.y < vr.top - 20 || drag.y > vr.bottom + 20) return null;
    const cardLeft = drag.x - drag.offX - vr.left + viewport.scrollLeft - PAD - CARD_INSET;
    const slot = Math.min(TOTAL - 1, Math.max(0, Math.round(cardLeft / SLOT)));
    const m = Math.floor(slot / 4), p = slot % 4;
    return { m, p, valid: p + drag.dur <= 4 };
  }

  function updateDrag() {
    const g = drag.ghost;
    g.style.left = (drag.x - drag.offX) + 'px';
    g.style.top = (drag.y - drag.offY) + 'px';
    const t = computeTarget();
    drag.target = t;
    if (t) {
      hint.className = t.valid ? 'ok' : 'ng';
      hint.style.left = (PAD + (t.m * 4 + t.p) * SLOT) + 'px';
      hint.style.width = (drag.dur * SLOT) + 'px';
    } else {
      hint.className = '';
    }
    trash.classList.toggle('active', !t && drag.src.from === 'band');
  }

  // ドラッグ中に帯の左右の端へ近づくと自動スクロール
  function autoScroll() {
    if (!drag) return;
    const vr = viewport.getBoundingClientRect();
    const EDGE = 70;
    if (drag.y > vr.top - 40 && drag.y < vr.bottom + 40) {
      let dx = 0;
      if (drag.x < vr.left + EDGE) dx = -Math.ceil((vr.left + EDGE - drag.x) / 6);
      else if (drag.x > vr.right - EDGE) dx = Math.ceil((drag.x - (vr.right - EDGE)) / 6);
      dx = Math.max(-14, Math.min(14, dx));
      if (dx) {
        viewport.scrollLeft += dx;
        updateDrag();
      }
    }
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function onDragEnd(ev) {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    drag.x = ev.clientX; drag.y = ev.clientY;
    const t = computeTarget();
    const { src } = drag;
    let changed = false;
    if (t && t.valid) {
      if (src.from === 'band') state.notes = state.notes.filter((n) => n.id !== src.id);
      place(drag.type, t.m, t.p);
      changed = true;
    } else if (!t && src.from === 'band') {
      state.notes = state.notes.filter((n) => n.id !== src.id);  // 帯の外へ出したら削除
      changed = true;
    }
    // 小節線をまたぐ（赤）ときは何もしない＝元に戻る
    finishDrag();
    if (changed) { save(); renderNotes(); }
  }
  function onDragCancel(ev) {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    finishDrag();
  }
  function finishDrag() {
    cancelAnimationFrame(drag.raf);
    drag.ghost.remove();
    drag.srcEl.classList.remove('dragging-src');
    hint.className = '';
    trash.classList.remove('active');
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    window.removeEventListener('pointercancel', onDragCancel);
    drag = null;
  }

  // ===== 音（Web Audio API で合成） =====
  let ctx = null, noiseBuf = null, audioWarm = false;
  function initAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // 無音を 1 つ鳴らして出力装置を起こしておく
      const warm = ctx.createBufferSource();
      warm.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
      warm.connect(ctx.destination);
      warm.start();
    }
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
  }
  // 出力が実際に動き出す（currentTime が進み始める）まで待つ。
  // 起動直後に予約した音は、出力が立ち上がる前に過ぎてしまい鳴らないことがある。
  async function ensureAudio() {
    initAudio();
    if (ctx.state !== 'running') { try { await ctx.resume(); } catch (_) { /* 次の操作で再試行 */ } }
    const t = ctx.currentTime, limit = performance.now() + 1000;
    while ((ctx.currentTime === t || ctx.currentTime === 0) && performance.now() < limit) {
      await new Promise((r) => setTimeout(r, 10));
    }
  }
  // 最初に画面を触ったときに音の準備を始めておく（Chrome はユーザー操作の中でしか音を開始できない）
  window.addEventListener('pointerdown', initAudio, { once: true, capture: true });

  // ===== テンポを刻む音（選べる） =====
  // m: 音の高さの倍率、v: 音量
  const TICK = {
    count:  { m: 1,    v: 0.7 },   // 3, 2, 1
    high:   { m: 1.5,  v: 0.8 },   // はい！
    accent: { m: 1.25, v: 0.35 },  // 演奏中の 1 拍目
    beat:   { m: 1,    v: 0.22 },  // 演奏中の 2 拍目
  };

  // 高さが f0 から f1 へ glide 秒で変わる短い音
  function blip(t, out, { type = 'sine', f0, f1 = f0, glide = 0.03, v, dur }) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + glide);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.02);
  }

  const VOICES = {
    poko: { label: '🫧 ぽこぽこ', play(t, m, v, out) {
      blip(t, out, { f0: 380 * m, f1: 900 * m, glide: 0.045, v, dur: 0.1 });
    } },
    piyo: { label: '🐤 ぴよぴよ', play(t, m, v, out) {
      blip(t, out, { f0: 1900 * m, f1: 3000 * m, glide: 0.05, v: v * 0.6, dur: 0.07 });
      blip(t + 0.075, out, { f0: 2100 * m, f1: 3200 * m, glide: 0.04, v: v * 0.45, dur: 0.06 });
    } },
    piko: { label: '🎮 ピコピコ', play(t, m, v, out) {
      blip(t, out, { type: 'square', f0: 880 * m, v: v * 0.3, dur: 0.045 });
      blip(t + 0.045, out, { type: 'square', f0: 1760 * m, v: v * 0.3, dur: 0.06 });
    } },
    kira: { label: '✨ きらきら', play(t, m, v, out) {
      blip(t, out, { f0: 1320 * m, v: v * 0.7, dur: 0.35 });
      blip(t, out, { f0: 1320 * m * 2.76, v: v * 0.2, dur: 0.15 });
    } },
    pettan: { label: '🍡 ぺったん', play(t, m, v, out) {
      blip(t, out, { f0: 190 * m, f1: 70 * m, glide: 0.12, v, dur: 0.18 });
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 900;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v * 0.5, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      src.connect(lp).connect(g).connect(out);
      src.start(t, Math.random() * 0.5); src.stop(t + 0.07);
    } },
    wood: { label: '🪵 ウッドブロック', play(t, m, v, out) {
      blip(t, out, { type: 'triangle', f0: 1150 * m, f1: 1000 * m, v, dur: 0.07 });
    } },
  };

  function tick(t, kind, out) {
    const k = TICK[kind];
    VOICES[state.sound].play(t, k.m, k.v, out);
  }

  // ハンドクラップ：短いノイズを 3 回重ねて余韻をつける
  function clap(t, out) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1150; bp.Q.value = 0.9;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    for (const d of [0, 0.011, 0.022]) {
      g.gain.setValueAtTime(1.0, t + d);
      g.gain.exponentialRampToValueAtTime(0.08, t + d + 0.009);
    }
    g.gain.setValueAtTime(0.9, t + 0.033);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    src.connect(bp).connect(g).connect(out);
    src.start(t, Math.random() * 0.5);
    src.stop(t + 0.22);
  }

  // 星が光るときの「キラン」。k 番目の星ほど少し高くする
  function kiranSound(k = 0) {
    const t = ctx.currentTime + 0.01, m = Math.pow(2, k / 12 * 2);
    blip(t, ctx.destination, { f0: 1568 * m, v: 0.25, dur: 0.12 });
    blip(t + 0.07, ctx.destination, { f0: 2349 * m, v: 0.22, dur: 0.35 });
    blip(t + 0.07, ctx.destination, { f0: 2349 * m * 2.76, v: 0.06, dur: 0.15 });
  }

  // 結果発表のドラムロール
  function drumroll(dur) {
    const t0 = ctx.currentTime + 0.02;
    for (let t = 0; t < dur; t += 0.045) {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.7;
      const g = ctx.createGain();
      const v = 0.08 + 0.25 * (t / dur);
      g.gain.setValueAtTime(0.0001, t0 + t);
      g.gain.exponentialRampToValueAtTime(v, t0 + t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + t + 0.04);
      src.connect(bp).connect(g).connect(ctx.destination);
      src.start(t0 + t, Math.random() * 0.5); src.stop(t0 + t + 0.05);
    }
  }

  // 結果発表のファンファーレ（ド・ミ・ソ・ド）
  function fanfare() {
    const t = ctx.currentTime + 0.02;
    [523, 659, 784, 1047].forEach((f, k) => {
      const last = k === 3;
      blip(t + k * 0.12, ctx.destination, { type: 'triangle', f0: f, v: 0.35, dur: last ? 0.6 : 0.14 });
      blip(t + k * 0.12, ctx.destination, { type: 'square', f0: f, v: 0.06, dur: last ? 0.5 : 0.12 });
    });
  }

  // ===== たたいて判定・点数・星 =====
  // ずれ（秒）がこの範囲なら、その判定。最後はたたかなかった音符。
  const GRADES = [
    { win: 0.09,     mk: '💮', wd: 'はなまる！', pts: 100, color: '#e91e63' },
    { win: 0.15,     mk: '◎',  wd: 'すごい！',   pts: 80,  color: '#e53935' },
    { win: 0.21,     mk: '○',  wd: 'いいね',     pts: 60,  color: '#fb8c00' },
    { win: 0.28,     mk: '△',  wd: 'おしい',     pts: 40,  color: '#1e88e5' },
    { win: Infinity, mk: '✓',  wd: 'ざんねん',   pts: 0,   color: '#78909c' },
  ];
  const HIT_WIN = 0.28;
  const MISS = GRADES.length - 1;
  const STRAY = { mk: '✓', wd: 'たたきすぎ', color: '#78909c' };
  const STRAY_PENALTY = 20;     // 休符や何もないところでたたいたときの減点

  let game = { score: 0, max: 0, lit: 0, judged: new Set(), scoring: true };

  const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
  function buildStars() {
    for (const box of [starsEl, resStars]) {
      for (let i = 0; i < 5; i++) {
        const el = document.createElement('span');
        el.className = 'star';
        el.innerHTML = STAR_SVG;
        box.appendChild(el);
      }
    }
  }

  function kiranStar(el) {
    el.classList.add('lit');
    el.classList.remove('kiran');
    void el.offsetWidth;
    el.classList.add('kiran');
  }

  // 100 点満点の点数と ☆ の数。☆ は 20・40・60・80 点で 1〜4 つ、95 点以上で 5 つ
  function percent() { return game.max ? Math.round(Math.max(0, game.score) / game.max * 100) : 0; }
  function starCount(pct) { return pct >= 95 ? 5 : Math.min(4, Math.floor(pct / 20)); }

  // scoring が false（おてほん ON）のときは採点しない
  function resetGame(scoring) {
    const hits = state.notes.filter((n) => !TYPES[n.t].rest).length;
    game = { score: 0, max: hits * 100, lit: 0, judged: new Set(), scoring };
    document.body.classList.toggle('scoring', scoring);
    renderZones();
    for (const el of starsEl.children) el.classList.remove('lit', 'kiran');
    updateScore();
  }

  // 点数と星を更新。新しく光った星はキランと光らせて音も鳴らす
  function updateScore() {
    if (!game.scoring) { pointsEl.textContent = 'おてほん'; return; }
    if (game.max === 0) { pointsEl.textContent = '-- てん'; return; }
    const pct = percent(), lit = starCount(pct);
    pointsEl.textContent = pct + ' てん';
    [...starsEl.children].forEach((el, i) => {
      if (i >= game.lit && i < lit) kiranStar(el);
      else el.classList.toggle('lit', i < lit);
    });
    if (lit > game.lit && ctx) kiranSound(lit - 1);
    game.lit = lit;
  }

  // ===== けっか はっぴょう =====
  const RESULT_MSG = [
    'スペースキーで リズムを うってみよう！',
    'つぎは もっと できるよ！',
    'がんばったね！',
    'いいね！ そのちょうし！',
    'すごい！ あと すこしで パーフェクト！',
    'パーフェクト！ すばらしい！',
  ];
  // ===== じぶんランキング =====
  const TITLES = [
    [100, 'リズムのでんせつ'],
    [95,  'リズムマスター'],
    [80,  'リズムの たつじん'],
    [60,  'リズムの なかま'],
    [40,  'リズムの みならい'],
    [0,   'リズムの たまご'],
  ];
  const titleOf = (pct) => TITLES.find(([min]) => pct >= min)[1];
  const MEDALS = ['🥇', '🥈', '🥉'];
  let newRankDate = null;   // さっき入った記録（NEW! を付ける）

  // 点数の高い順。同じ点数ならテンポが速いほう、それも同じなら新しいほうが上
  function compareRecord(a, b) {
    return b.pct - a.pct || b.bpm - a.bpm || (a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  }
  // 記録を追加して、入った順位（0 始まり）を返す。ランク外なら -1
  function addRecord(pct) {
    const rec = { pct, bpm: state.bpm, date: new Date().toISOString() };
    const list = [...state.ranking, rec].sort(compareRecord).slice(0, RANK_SIZE);
    const rank = list.indexOf(rec);
    state.ranking = list;
    if (rank >= 0) newRankDate = rec.date;
    save();
    renderRanking();
    return rank;
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    const pad = (x) => String(x).padStart(2, '0');
    return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`;
  }

  function renderRanking() {
    rankList.innerHTML = '';
    for (let i = 0; i < RANK_SIZE; i++) {
      const r = state.ranking[i];
      const li = document.createElement('li');
      const medal = i === 0 && r ? '👑' : (MEDALS[i] || '');
      const place = `<small>${i + 1}い</small>`;
      if (!r) {
        li.className = 'empty';
        li.innerHTML = `<div class="medal">${place}</div><div class="pts">まだ ないよ</div>`;
      } else {
        li.className = 'r' + (i + 1) + (r.date === newRankDate ? ' new' : '');
        li.innerHTML = `<div class="medal">${medal}${place}</div>` +
          `<div class="pts">${r.pct}<span style="font-size:14px">てん</span><span class="st">${'★'.repeat(starCount(r.pct))}</span></div>` +
          `<div class="ttl">${titleOf(r.pct)}</div>` +
          `<div class="meta">テンポ ${r.bpm} ・ ${fmtDate(r.date)}</div>` +
          (r.date === newRankDate ? '<span class="newb">NEW!</span>' : '');
      }
      rankList.appendChild(li);
    }
  }

  function confetti() {
    const colors = ['#ff4081', '#ffd600', '#40c4ff', '#69f0ae', '#ff9100', '#b388ff'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      c.style.borderRadius = Math.random() < 0.4 ? '50%' : '2px';
      c.addEventListener('animationend', () => c.remove());
      document.body.appendChild(c);
    }
  }

  rankClear.addEventListener('click', () => {
    if (state.ranking.length === 0) return;
    if (!confirm('ランキングを ぜんぶ けしても いいですか？')) return;
    state.ranking = [];
    newRankDate = null;
    save(); renderRanking();
  });

  // ===== けっか はっぴょう =====
  let resultTimers = [];
  function showResult() {
    closeResult();
    const pct = percent(), n = starCount(pct);
    const hadBefore = state.ranking.length > 0;
    const prevLast = state.ranking.length >= RANK_SIZE ? state.ranking[RANK_SIZE - 1].pct : null;
    const rank = addRecord(pct);
    let rankLine;
    if (rank === 0) rankLine = `<div class="rank top">👑 ${hadBefore ? 'じこベスト こうしん！' : 'はじめての きろく！ 1い！'}</div>`;
    else if (rank > 0) rankLine = `<div class="rank in">🎉 ${rank + 1}いに ランクイン！</div>`;
    else rankLine = `<div class="rank out">5いまで あと ${Math.max(1, prevLast - pct)}てん！ がんばろう！</div>`;
    for (const el of resStars.children) el.classList.remove('lit', 'kiran');
    resText.innerHTML = '';
    resultEl.classList.add('show');
    const ROLL = 1.2, STEP = 0.45;
    drumroll(ROLL);
    const later = (sec, fn) => resultTimers.push(setTimeout(fn, sec * 1000));
    for (let i = 0; i < n; i++) {
      later(ROLL + 0.1 + i * STEP, () => { kiranStar(resStars.children[i]); kiranSound(i); });
    }
    later(ROLL + 0.3 + n * STEP, () => {
      resText.innerHTML = `<div class="big">★ ${n}つ！</div><div class="pts">${pct} てん ・ ${titleOf(pct)}</div><div class="msg">${RESULT_MSG[n]}</div>`;
      if (n > 0) fanfare();
    });
    later(ROLL + 1.1 + n * STEP, () => {
      resText.insertAdjacentHTML('beforeend', rankLine);
      if (rank >= 0) { kiranSound(2); kiranSound(4); }
      if (rank === 0 || n === 5) confetti();
    });
  }
  function closeResult() {
    resultTimers.forEach(clearTimeout);
    resultTimers = [];
    resultEl.classList.remove('show');
  }
  resClose.addEventListener('click', closeResult);
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeResult(); });

  function showJudge(g) {
    stage.querySelectorAll('.judge').forEach((el) => el.remove());
    const el = document.createElement('div');
    el.className = 'judge';
    el.style.color = g.color;
    el.innerHTML = `<span class="mk">${g.mk}</span><span class="wd">${g.wd}</span>`;
    el.addEventListener('animationend', () => el.remove());
    stage.appendChild(el);
  }

  function judgeNote(n, gi, show = true) {
    game.judged.add(n.id);
    const z = zoneEls.get(n.id);
    if (z) z.classList.add('done');
    game.score += GRADES[gi].pts;
    if (show) showJudge(GRADES[gi]);
    updateScore();
  }

  // スペースキー（または画面タップ）でたたいたとき
  function hit(ev) {
    if (mode !== 'playing' || !session) return;
    const s = session;
    const late = Math.max(0, (performance.now() - ev.timeStamp) / 1000);  // 入力から処理までの遅れ
    const now = ctx.currentTime - late - s.lat;
    clap(ctx.currentTime, ctx.destination);    // たたいた音
    if (!game.scoring) return;                 // おてほん ON のときは採点しない
    if (now < s.time(s.R) - HIT_WIN) return;   // カウント中は数えない
    let best = null, bestD = Infinity;
    for (const n of state.notes) {
      if (TYPES[n.t].rest || game.judged.has(n.id)) continue;
      const d = Math.abs(now - s.time(startOf(n)));
      if (d < bestD) { bestD = d; best = n; }
    }
    if (best && bestD <= HIT_WIN) {
      judgeNote(best, GRADES.findIndex((g) => bestD <= g.win));
    } else {
      game.score = Math.max(0, game.score - STRAY_PENALTY);
      showJudge(STRAY);
      updateScore();
    }
  }

  // ===== 再生 =====
  let starting = false;
  async function play() {
    if (mode === 'playing' || starting) return;
    closeResult();
    if (drag) finishDrag();
    starting = true;
    btnPlay.disabled = true;
    try { await ensureAudio(); } finally { starting = false; }
    if (mode === 'playing') return;
    const resume = mode === 'paused';
    const R = resume ? Math.max(0, Math.floor(pausedE / 2) * 2) : 0;   // 拍の頭から再開
    const labels = resume ? ['1', 'はい！'] : ['3', '2', '1', 'はい！'];
    const startE = R - labels.length * 2;
    const es = 30 / state.bpm;           // 八分音符 1 つの秒数
    // 1 回目は出力の立ち上がりに余裕をもたせる
    const t0 = ctx.currentTime + (audioWarm ? 0.12 : 0.35);
    audioWarm = true;
    const out = ctx.createGain();
    out.connect(ctx.destination);
    const time = (e) => t0 + (e - startE) * es;
    // 聞こえる音は出力の遅れぶん後ろにずれるので、表示と判定もそれに合わせる
    const lat = Math.min(0.1, Math.max(0, ctx.outputLatency || ctx.baseLatency || 0));
    if (!resume) resetGame(!state.otehon);

    const popped = new Set();
    for (const n of state.notes) if (startOf(n) < R) popped.add(n.id);
    session = { t0, startE, R, es, out, labels, time, lat, popped, lastLabel: -1, curE: startE, raf: 0 };

    labels.forEach((_, k) => tick(time(startE + k * 2), k === labels.length - 1 ? 'high' : 'count', out));
    for (let e = R; e < TOTAL; e += 2) tick(time(e), e % 4 === 0 ? 'accent' : 'beat', out);
    if (state.otehon) {
      for (const n of state.notes) {
        if (!TYPES[n.t].rest && startOf(n) >= R) clap(time(startOf(n)), out);
      }
    }

    mode = 'playing';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();  // スペースでボタンが押されないように
    viewport.scrollLeft = 0;
    document.body.classList.add('playmode');
    document.body.classList.remove('pausemode');
    updateButtons();
    session.raf = requestAnimationFrame(frame);
  }

  function frame() {
    if (mode !== 'playing' || !session) return;
    const s = session;
    const now = ctx.currentTime - s.lat;
    const e = Math.max(s.startE, s.startE + (now - s.t0) / s.es);
    s.curE = e;
    renderPlayhead(e);

    // カウントダウン
    if (e < s.R + 1) {
      const k = Math.floor((e - s.startE) / 2);
      if (k >= 0 && k < s.labels.length && k !== s.lastLabel) {
        s.lastLabel = k;
        showCount(s.labels[k]);
      }
    } else if (countEl.classList.contains('show')) {
      hideCount();
    }

    // 音符のポコッと光る表示
    for (const n of state.notes) {
      const el = noteEls.get(n.id);
      if (!el) continue;
      const st = startOf(n), en = st + TYPES[n.t].dur;
      if (!s.popped.has(n.id) && e >= st) {
        s.popped.add(n.id);
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
      }
      el.classList.toggle('sounding', e >= st && e < en);
      // たたかないまま通り過ぎた音符
      if (game.scoring && !TYPES[n.t].rest && !game.judged.has(n.id) && st >= s.R && now > s.time(st) + HIT_WIN) judgeNote(n, MISS);
    }

    // バーがはなまるの範囲に入っている間はバーもピンクに光らせる
    let inZone = false;
    for (const n of game.scoring ? state.notes : []) {
      if (TYPES[n.t].rest || game.judged.has(n.id) || startOf(n) < s.R) continue;
      if (Math.abs(now - s.time(startOf(n))) <= GRADES[0].win) { inZone = true; break; }
    }
    playbar.classList.toggle('inzone', inZone);

    if (ctx.currentTime >= s.time(TOTAL) + 1) {
      stop();
      if (game.scoring && game.max > 0) showResult();   // 最後まで演奏したら結果発表
      return;
    }
    s.raf = requestAnimationFrame(frame);
  }

  function renderPlayhead(e) {
    const center = viewport.clientWidth / 2;
    band.style.transform = `translateX(${center - (PAD + e * SLOT)}px)`;
    const cur = e >= 0 && e < TOTAL ? Math.floor(e / 4) : -1;
    measuresEl.querySelectorAll('.measure').forEach((el, i) => el.classList.toggle('now', i === cur));
    mmHead.style.left = (Math.min(1, Math.max(0, e / TOTAL)) * 100) + '%';
  }

  function showCount(text) {
    countEl.classList.add('show');
    countSpan.textContent = text;
    countSpan.classList.remove('go');
    void countSpan.offsetWidth;
    countSpan.classList.add('go');
  }
  function hideCount() {
    countEl.classList.remove('show');
    countSpan.textContent = '';
  }

  function endSession() {
    if (!session) return;
    cancelAnimationFrame(session.raf);
    try { session.out.disconnect(); } catch (_) { /* 既に切断済み */ }
    session = null;
    hideCount();
  }

  function pause() {
    if (mode !== 'playing') return;
    pausedE = Math.min(TOTAL, Math.max(session.R, session.curE));
    // 再開位置より前で、まだ判定していない音符は「たたかなかった」ことにする
    const nextR = Math.floor(pausedE / 2) * 2;
    for (const n of game.scoring ? state.notes : []) {
      if (!TYPES[n.t].rest && !game.judged.has(n.id) && startOf(n) < nextR) judgeNote(n, MISS, false);
    }
    endSession();
    mode = 'paused';
    playbar.classList.remove('inzone');
    document.body.classList.add('pausemode');
    for (const el of noteEls.values()) el.classList.remove('pop');
    updateButtons();
  }

  function stop() {
    endSession();
    playbar.classList.remove('inzone');
    mode = 'edit';
    pausedE = 0;
    document.body.classList.remove('playmode', 'pausemode');
    band.style.transform = '';
    measuresEl.querySelectorAll('.measure').forEach((el) => el.classList.remove('now'));
    for (const el of noteEls.values()) el.classList.remove('pop', 'sounding');
    viewport.scrollLeft = 0;
    updateMinimapWindow();
    updateButtons();
  }

  function updateButtons() {
    btnPlay.disabled = mode === 'playing';
    btnPlay.textContent = mode === 'paused' ? '▶ つづきから' : '▶ さいせい';
    btnPause.disabled = mode !== 'playing';
    btnStop.disabled = mode === 'edit';
    bpmInput.disabled = mode === 'playing';
    btnOtehon.disabled = mode !== 'edit';   // 一時停止中も切り替えない（採点するかどうかが途中で変わらないように）
    soundSel.disabled = mode === 'playing';
    btnClear.disabled = mode !== 'edit';
  }

  function renderSettings() {
    bpmInput.value = state.bpm;
    bpmVal.textContent = state.bpm;
    soundSel.value = state.sound;
    btnOtehon.setAttribute('aria-pressed', String(state.otehon));
    btnOtehon.textContent = state.otehon ? '👏 おてほん ON' : '👏 おてほん OFF';
  }

  // ===== リズムを画像にしてコピー（ロイロノートなどに貼り付け用） =====
  const SHOT_COLS = 4;                       // 1 段に 4 小節 × 2 段
  const SHOT_M = 28, SHOT_TOP = 64, SHOT_ROW = 196;
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  function rhythmSVG() {
    const W = SHOT_M * 2 + SHOT_COLS * MEASURE;
    const H = SHOT_TOP + Math.ceil(NM / SHOT_COLS) * SHOT_ROW + 10;
    const font = `font-family="Hiragino Maru Gothic ProN, M PLUS Rounded 1c, Noto Sans JP, Noto Sans CJK JP, sans-serif" font-weight="bold"`;
    const d = new Date();
    let o = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ${font}>`;
    o += `<rect width="${W}" height="${H}" fill="#fffaf0"/>`;
    o += `<text x="${SHOT_M}" y="40" font-size="26" fill="#e8702a">じゅうごやさんの もちつき　リズム</text>`;
    o += `<text x="${W - SHOT_M}" y="40" font-size="16" fill="#8a7f70" text-anchor="end">テンポ ${state.bpm}　${d.getMonth() + 1}/${d.getDate()}</text>`;
    const origin = (m) => [SHOT_M + (m % SHOT_COLS) * MEASURE, SHOT_TOP + Math.floor(m / SHOT_COLS) * SHOT_ROW];
    for (let m = 0; m < NM; m++) {
      const [x, y] = origin(m);
      o += `<text x="${x + 6}" y="${y + 14}" font-size="11" font-weight="normal" fill="#8a7f70">${m + 1}</text>`;
      o += `<text x="${x + MEASURE / 2}" y="${y + 30}" font-size="20" fill="#333" text-anchor="middle">${esc(LYRICS[m])}</text>`;
      o += `<rect x="${x}" y="${y + 44}" width="${MEASURE}" height="124" fill="#fcfaf6"/>`;
      for (const k of [1, 2, 3]) {
        o += `<line x1="${x + k * SLOT}" y1="${y + 52}" x2="${x + k * SLOT}" y2="${y + 160}" stroke="${k === 2 ? '#c9b594' : '#e2d6c2'}" stroke-width="2" stroke-dasharray="${k === 2 ? '6 4' : '2 4'}"/>`;
      }
      o += `<rect x="${x - 1.5}" y="${y + 44}" width="3" height="124" fill="#555"/>`;
      if (m % SHOT_COLS === SHOT_COLS - 1) {
        if (m === NM - 1) o += `<rect x="${x + MEASURE - 8}" y="${y + 44}" width="2" height="124" fill="#555"/><rect x="${x + MEASURE - 3}" y="${y + 44}" width="5" height="124" fill="#555"/>`;
        else o += `<rect x="${x + MEASURE - 1.5}" y="${y + 44}" width="3" height="124" fill="#555"/>`;
      }
    }
    const { roles } = computeBeams();
    for (const n of state.notes) {
      const def = TYPES[n.t], [x, y] = origin(n.m);
      const w = def.dur * SLOT - CARD_INSET * 2;
      const rest = def.rest;
      o += `<g transform="translate(${x + n.p * SLOT + CARD_INSET} ${y + 50})" color="#222">`;
      o += `<rect x="1.5" y="1.5" width="${w - 3}" height="109" rx="9" fill="${rest ? '#e3f0fc' : '#fff0d9'}" stroke="${rest ? '#6aa3d8' : '#f0a040'}" stroke-width="3"/>`;
      if (def.dur >= 2) o += `<rect x="46" y="50" width="${w - 54}" height="10" rx="5" fill="${rest ? '#a8cbee' : '#f5b560'}"/>`;
      o += symbolSVG(n.t, roles.get(n.id)).replace('<svg class="sym"', '<svg x="4" y="2" width="40" height="70" overflow="visible"');
      o += `<text x="6" y="100" font-size="20" fill="#222">${def.label}</text>`;
      o += '</g>';
    }
    return { svg: o + '</svg>', W, H };
  }

  async function rhythmPNG() {
    const { svg, W, H } = rhythmSVG();
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();
    const scale = 2;   // 貼り付けたときにくっきり見えるように 2 倍で描く
    const cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = H * scale;
    const g = cv.getContext('2d');
    g.scale(scale, scale);
    g.drawImage(img, 0, 0);
    return new Promise((resolve, reject) => cv.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob'))), 'image/png'));
  }

  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3500);
  }

  async function copyRhythm() {
    if (mode !== 'edit') return;
    const png = rhythmPNG();
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
      toast('📋 コピーしたよ！ ロイロノートで Ctrl + V で はりつけてね');
    } catch (_) {
      // コピーできない環境（ファイルを直接開いたときなど）では画像を保存する
      try {
        const url = URL.createObjectURL(await png);
        const a = document.createElement('a');
        a.href = url; a.download = 'jugoya-rhythm.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('💾 がぞうを ダウンロードしたよ');
      } catch (_) {
        toast('ごめんね、がぞうを つくれなかったよ');
      }
    }
  }
  btnShot.addEventListener('click', copyRhythm);

  // ===== イベント =====
  btnPlay.addEventListener('click', play);
  btnPause.addEventListener('click', pause);
  btnStop.addEventListener('click', stop);
  btnOtehon.addEventListener('click', () => {
    state.otehon = !state.otehon;
    renderSettings(); save();
  });
  bpmInput.addEventListener('input', () => {
    state.bpm = Number(bpmInput.value);
    bpmVal.textContent = state.bpm;
  });
  bpmInput.addEventListener('change', save);
  for (const key of SOUND_KEYS) soundSel.add(new Option(VOICES[key].label, key));
  soundSel.addEventListener('change', async () => {
    state.sound = soundSel.value;
    save();
    // 選んだ音をためしに鳴らす（3 → はい！）
    await ensureAudio();
    const t = ctx.currentTime + 0.05;
    tick(t, 'count', ctx.destination);
    tick(t + 0.35, 'high', ctx.destination);
  });
  btnClear.addEventListener('click', () => {
    if (mode !== 'edit' || state.notes.length === 0) return;
    if (!confirm('おいたカードを ぜんぶ けしても いいですか？')) return;
    state.notes = [];
    save(); renderNotes();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  document.addEventListener('keydown', (ev) => {
    if (ev.code !== 'Space' || mode !== 'playing') return;
    ev.preventDefault();
    if (!ev.repeat) hit(ev);
  });
  document.addEventListener('keyup', (ev) => { if (ev.code === 'Space' && mode === 'playing') ev.preventDefault(); });
  stage.addEventListener('pointerdown', (ev) => { if (mode === 'playing') { ev.preventDefault(); hit(ev); } });

  // ===== 初期化 =====
  load();
  buildMeasures();
  buildMinimap();
  buildPalette();
  buildStars();
  renderRanking();
  renderSettings();
  renderNotes();
  updateButtons();
})();
</script>
</body>
</html>
